<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4c7900">
  <title>Arthur</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="login-screen" id="login-screen">
    <div class="login-card">
      <div class="login-brand" aria-label="Arthur">
        <img class="login-brand-mark" src="logo.png" alt="Logo Arthur">
      </div>
      <p class="login-tagline">Satu Pandangan, Kendali Penuh</p>
      <form id="login-form" novalidate>
        <span class="login-label">Masuk sebagai</span>
        <div class="role-choice-list" role="group" aria-label="Pilih peran pengguna">
          <button class="role-choice" type="button" data-login-role="admin" aria-pressed="false">Admin</button>
          <button class="role-choice" type="button" data-login-role="student" aria-pressed="false">Mahasiswa</button>
          <button class="role-choice" type="button" data-login-role="manager" aria-pressed="false">Manager<br>Controlling</button>
        </div>
        <label class="login-label" for="login-username">Username atau Email</label>
        <div class="login-field login-input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
          <input id="login-username" name="username" type="text" autocomplete="username" placeholder="Masukkan username Anda" aria-describedby="login-error" required>
        </div>
        <label class="login-label" for="login-password">Password</label>
        <div class="login-field login-input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password Anda" aria-describedby="login-error" required>
          <button class="password-toggle" id="password-toggle" type="button" aria-label="Tampilkan password" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          </button>
        </div>
        <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
        <button class="login-submit" type="submit">Masuk</button>
      </form>
      <p class="login-copyright">© 2026 Arthur. All rights reserved.</p>
    </div>
  </section>
  <div class="app" id="dashboard-app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="logo.png" alt="">
      </div>
      <p class="nav-label" id="nav-label">Menu Mahasiswa</p>
      <nav class="nav-list" id="navigation" aria-label="Navigasi utama"></nav>
      <div class="sidebar-bottom">
        <div class="profile">
          <div class="avatar" id="profile-avatar">RF</div>
          <div class="profile-info">
            <div class="profile-name" id="profile-name">Ridwan Fathurrahman</div>
            <div class="profile-role" id="profile-role">Akun aktif</div>
          </div>
          <button class="logout" id="logout-button" type="button">Logout</button>
        </div>
      </div>
    </aside>
    <main class="main">
      <div id="view"></div>
    </main>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
